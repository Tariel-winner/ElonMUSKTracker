<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛩️ Elon Musk Tracker</title>
  
  <!-- Leaflet CSS (Map Library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff, #7b2ffc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
    }
    
    .header .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    
    .header .status-badge .dot.live {
      background: #00ff88;
    }
    
    .header .status-badge .dot.error {
      background: #ff4444;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Main Layout */
    .main-content {
      display: flex;
      flex: 1;
      gap: 12px;
      min-height: 0;
    }
    
    /* Map Container */
    .map-container {
      flex: 3;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      position: relative;
    }
    
    #map {
      width: 100%;
      height: 100%;
      background: #0a0a12;
    }
    
    /* Sidebar */
    .sidebar {
      flex: 1;
      min-width: 280px;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    /* Status Card - Enhanced with Glow */
    .status-card {
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      transition: all 0.4s ease;
    }
    
    .status-card.landed {
      border-color: rgba(0, 255, 136, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
    }
    
    .status-card.in_flight {
      border-color: rgba(255, 170, 0, 0.3);
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.05);
    }
    
    .status-card.grounded {
      border-color: rgba(136, 136, 255, 0.3);
      box-shadow: 0 0 30px rgba(136, 136, 255, 0.05);
    }
    
    .status-card.unknown {
      border-color: rgba(255, 255, 255, 0.05);
    }
    
    .status-card .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .status-card .status-header .icon {
      font-size: 24px;
    }
    
    .status-card .status-header .state {
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status-card .status-header .state.landed { color: #00ff88; }
    .status-card .status-header .state.in_flight { color: #ffaa00; }
    .status-card .status-header .state.grounded { color: #8888ff; }
    .status-card .status-header .state.unknown { color: #666; }
    
    .status-card .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      margin-left: auto;
      font-weight: 400;
    }
    
    .status-card .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .status-card .row:last-child {
      border-bottom: none;
    }
    
    .status-card .label {
      color: #888;
    }
    
    .status-card .value {
      color: #eee;
      font-weight: 500;
      text-align: right;
    }
    
    .status-card .value .confidence-high { color: #00ff88; }
    .status-card .value .confidence-med { color: #ffaa00; }
    .status-card .value .confidence-low { color: #ff4444; }
    
    /* Confidence Bar */
    .confidence-bar-container {
      width: 100%;
      margin-top: 8px;
    }
    
    .confidence-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .confidence-bar .fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
      background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #00ff88 100%);
      width: 0%;
    }
    
    .confidence-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #555;
      margin-top: 4px;
    }
    
    .status-card .reasoning {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
      max-height: 80px;
      overflow-y: auto;
    }
    
    .status-card .reasoning li {
      list-style: none;
      padding: 2px 0;
    }
    
    .status-card .reasoning li::before {
      content: "▸ ";
      color: #00d4ff;
    }
    
    .status-card .reasoning::-webkit-scrollbar {
      width: 2px;
    }
    
    .status-card .reasoning::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .status-card .reasoning::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 1px;
    }
    
    .status-card .timestamp {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      text-align: right;
    }
    
    /* Timeline Slider - ENHANCED */
    .timeline-container {
      flex: 1;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    
    .timeline-container .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .timeline-container .slider-header .live-label {
      color: #00ff88;
      font-weight: 600;
    }
    
    .timeline-container .slider-header .live-label.paused {
      color: #ffaa00;
    }
    
    .timeline-container input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: linear-gradient(to right, #1a1a2e, #00d4ff);
      border-radius: 2px;
      outline: none;
      margin: 8px 0;
    }
    
    .timeline-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: 2px solid #0a0a12;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      transition: all 0.2s ease;
    }
    
    .timeline-container input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    
    .timeline-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: 2px solid #0a0a12;
    }
    
    /* TIMELINE EVENTS - FIXED & ENHANCED */
    .timeline-events {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      overflow-y: auto;
      flex: 1;
      align-content: flex-start;
      padding-right: 4px;
      max-height: none;
    }
    
    .timeline-events .event {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 10px;
      border-radius: 12px;
      color: #888;
      white-space: nowrap;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .timeline-events .event .time {
      color: #555;
      font-weight: 500;
    }
    
    .timeline-events .event .dest {
      color: #00d4ff;
      font-weight: 500;
    }
    
    .timeline-events .event .conf {
      color: #444;
      font-size: 9px;
    }
    
    .timeline-events .event .state-icon {
      font-size: 11px;
    }
    
    /* Color coding by event type */
    .timeline-events .event.landed {
      border-left-color: #00ff88;
      background: rgba(0, 255, 136, 0.06);
    }
    
    .timeline-events .event.landed .dest {
      color: #00ff88;
    }
    
    .timeline-events .event.in_flight {
      border-left-color: #ffaa00;
      background: rgba(255, 170, 0, 0.06);
    }
    
    .timeline-events .event.in_flight .dest {
      color: #ffaa00;
    }
    
    .timeline-events .event.grounded,
    .timeline-events .event.parked {
      border-left-color: #8888ff;
      background: rgba(136, 136, 255, 0.06);
    }
    
    .timeline-events .event.grounded .dest,
    .timeline-events .event.parked .dest {
      color: #8888ff;
    }
    
    .timeline-events .event.unknown {
      border-left-color: #666;
    }
    
    .timeline-events .event:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }
    
    /* Scrollbar styling */
    .timeline-events::-webkit-scrollbar {
      width: 3px;
    }
    
    .timeline-events::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .timeline-events::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 2px;
    }
    
    .timeline-events::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.5);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
      }
      
      .sidebar {
        min-width: unset;
        max-width: unset;
        flex-direction: row;
        flex-wrap: wrap;
      }
      
      .sidebar .status-card {
        flex: 1;
        min-width: 200px;
      }
      
      .sidebar .timeline-container {
        flex: 1;
        min-width: 200px;
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <h1>🛩️ Elon Musk Tracker</h1>
      <div class="status-badge">
        <span class="dot live" id="status-dot"></span>
        <span id="status-text">Live</span>
        <span style="color: #444;">|</span>
        <span id="last-updated">Updating...</span>
      </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
      <!-- Map -->
      <div class="map-container">
        <div id="map"></div>
      </div>
      
      <!-- Sidebar -->
      <div class="sidebar">
        <!-- Status Card -->
        <div class="status-card" id="status-card">
          <div class="status-header">
            <span class="icon" id="status-icon">❓</span>
            <span class="state unknown" id="status-state">UNKNOWN</span>
            <span class="badge" id="status-badge">● LIVE</span>
          </div>
          <div class="row">
            <span class="label">📍 Current</span>
            <span class="value" id="current-location">Unknown</span>
          </div>
          <div class="row">
            <span class="label">🎯 Destination</span>
            <span class="value" id="destination">Unknown</span>
          </div>
          <div class="row">
            <span class="label">📊 Confidence</span>
            <span class="value" id="confidence">0%</span>
          </div>
          
          <!-- Confidence Bar -->
          <div class="confidence-bar-container">
            <div class="confidence-bar">
              <div class="fill" id="confidence-fill"></div>
            </div>
            <div class="confidence-label">
              <span>Low</span>
              <span>Medium</span>
              <span>High</span>
            </div>
          </div>
          
          <div class="reasoning" id="reasoning">
            <li>Waiting for data...</li>
          </div>
          <div class="timestamp" id="timestamp">—</div>
        </div>
        
        <!-- Timeline Slider -->
        <div class="timeline-container">
          <div class="slider-header">
            <span>⏱️ Timeline</span>
            <span class="live-label" id="slider-mode">🔴 LIVE</span>
          </div>
          <input type="range" id="time-slider" min="0" max="100" value="100" />
          <div class="timeline-events" id="timeline-events">
            <span class="event">No events yet</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Leaflet JS (Map Library) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Frontend Logic -->
  <script src="/frontend-polling.js"></script>
</body>
</html>
