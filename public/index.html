<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🛩️ Elon Musk Tracker</title>
  
  <!-- Leaflet CSS (Map Library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff, #7b2ffc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
    }
    
    .header .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    
    .header .status-badge .dot.live {
      background: #00ff88;
    }
    
    .header .status-badge .dot.error {
      background: #ff4444;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Main Layout */
    .main-content {
      display: flex;
      flex: 1;
      gap: 8px;
      min-height: 0;
    }
    
    /* Map Container */
    .map-container {
      flex: 3;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      position: relative;
      min-height: 200px;
    }
    
    #map {
      width: 100%;
      height: 100%;
      background: #0a0a12;
    }
    
    /* Sidebar */
    .sidebar {
      flex: 1;
      min-width: 260px;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    /* Status Card - Enhanced with Glow */
    .status-card {
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      transition: all 0.4s ease;
    }
    
    .status-card.landed {
      border-color: rgba(0, 255, 136, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
    }
    
    .status-card.in_flight {
      border-color: rgba(255, 170, 0, 0.3);
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.05);
    }
    
    .status-card.grounded {
      border-color: rgba(136, 136, 255, 0.3);
      box-shadow: 0 0 30px rgba(136, 136, 255, 0.05);
    }
    
    .status-card.unknown {
      border-color: rgba(255, 255, 255, 0.05);
    }
    
    .status-card .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .status-card .status-header .icon {
      font-size: 22px;
    }
    
    .status-card .status-header .state {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status-card .status-header .state.landed { color: #00ff88; }
    .status-card .status-header .state.in_flight { color: #ffaa00; }
    .status-card .status-header .state.grounded { color: #8888ff; }
    .status-card .status-header .state.unknown { color: #666; }
    
    .status-card .badge {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      margin-left: auto;
      font-weight: 400;
    }
    
    .status-card .row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .status-card .row:last-child {
      border-bottom: none;
    }
    
    .status-card .label {
      color: #888;
    }
    
    .status-card .value {
      color: #eee;
      font-weight: 500;
      text-align: right;
    }
    
    .status-card .value .confidence-high { color: #00ff88; }
    .status-card .value .confidence-med { color: #ffaa00; }
    .status-card .value .confidence-low { color: #ff4444; }
    
    /* Confidence Bar */
    .confidence-bar-container {
      width: 100%;
      margin-top: 6px;
    }
    
    .confidence-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .confidence-bar .fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
      background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #00ff88 100%);
      width: 0%;
    }
    
    .confidence-label {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: #555;
      margin-top: 2px;
    }
    
    .status-card .reasoning {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-size: 11px;
      color: #aaa;
      line-height: 1.4;
      max-height: 60px;
      overflow-y: auto;
    }
    
    .status-card .reasoning li {
      list-style: none;
      padding: 1px 0;
    }
    
    .status-card .reasoning li::before {
      content: "▸ ";
      color: #00d4ff;
    }
    
    .status-card .reasoning::-webkit-scrollbar {
      width: 2px;
    }
    
    .status-card .reasoning::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .status-card .reasoning::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 1px;
    }
    
    .status-card .timestamp {
      font-size: 10px;
      color: #555;
      margin-top: 6px;
      text-align: right;
    }

    .status-card .data-meta {
      font-size: 10px;
      color: #667788;
      margin-top: 4px;
      text-align: right;
    }

    .status-card .observed-row .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #99aabb;
    }
    
    /* Timeline Slider - ENHANCED */
    .timeline-container {
      flex: 1;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      min-height: 120px;
    }
    
    .timeline-container .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }
    
    .timeline-container .slider-header .live-label {
      color: #00ff88;
      font-weight: 600;
    }
    
    .timeline-container .slider-header .live-label.paused {
      color: #ffaa00;
    }
    
    .timeline-container input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: linear-gradient(to right, #1a1a2e, #00d4ff);
      border-radius: 2px;
      outline: none;
      margin: 6px 0;
    }
    
    .timeline-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: 2px solid #0a0a12;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      transition: all 0.2s ease;
    }
    
    .timeline-container input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    
    .timeline-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: 2px solid #0a0a12;
    }
    
    /* ============================================= */
    /* CARDS TRACK - Single horizontal scroll row */
    /* ============================================= */
    .cards-track {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      margin-top: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      padding: 4px 2px 8px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      min-height: 80px;
      max-height: 120px;
      
      /* ✅ FIX: Better touch/scroll behavior */
      touch-action: pan-x;
      cursor: grab;
      user-select: none;
    }
    
    .cards-track:active {
      cursor: grabbing;
    }
    
    .cards-track .card-item {
      min-width: 180px;
      max-width: 240px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      
      /* ✅ FIX: Prevent text selection during drag */
      user-select: none;
      -webkit-user-select: none;
    }
    
    .cards-track .card-item.active {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
    }
    
    .cards-track .card-item .card-time {
      font-size: 10px;
      color: #666;
      margin-bottom: 3px;
    }
    
    .cards-track .card-item .card-dest {
      font-size: 13px;
      font-weight: 600;
      color: #eee;
    }
    
    .cards-track .card-item .card-conf {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    
    .cards-track .card-item .card-state {
      font-size: 10px;
      color: #555;
    }
    
    .cards-track::-webkit-scrollbar {
      height: 3px;
    }
    
    .cards-track::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .cards-track::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 2px;
    }
    
    .cards-track::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.5);
    }
    
    /* ============================================= */
    /* MOBILE RESPONSIVE - OPTIMIZED FOR PHONES */
    /* ============================================= */
    @media (max-width: 768px) {
      #app {
        padding: 6px;
      }
      
      .header h1 {
        font-size: 15px;
      }
      
      .header .status-badge {
        font-size: 10px;
      }
      
      .main-content {
        flex-direction: column;
        gap: 6px;
      }
      
      .map-container {
        flex: 2;
        min-height: 180px;
        border-radius: 10px;
      }
      
      .sidebar {
        min-width: unset;
        max-width: unset;
        flex: 1;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      .sidebar .status-card {
        flex: 1;
        min-width: 140px;
        padding: 12px 14px;
        border-radius: 10px;
      }
      
      .status-card .status-header .icon {
        font-size: 18px;
      }
      
      .status-card .status-header .state {
        font-size: 12px;
      }
      
      .status-card .row {
        font-size: 11px;
        padding: 2px 0;
      }
      
      .status-card .reasoning {
        font-size: 10px;
        max-height: 50px;
        padding: 4px 8px;
      }
      
      .status-card .badge {
        font-size: 8px;
        padding: 1px 6px;
      }
      
      .sidebar .timeline-container {
        flex: 1;
        min-width: 140px;
        min-height: 100px;
        padding: 10px 12px;
        border-radius: 10px;
      }
      
      .timeline-container .slider-header {
        font-size: 10px;
      }
      
      .timeline-container input[type="range"] {
        height: 3px;
        margin: 4px 0;
      }
      
      .timeline-container input[type="range"]::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
      }
      
      .cards-track .card-item {
        min-width: 140px;
        max-width: 180px;
        padding: 8px 12px;
      }
      
      .cards-track .card-item .card-dest {
        font-size: 11px;
      }
      
      .cards-track .card-item .card-time {
        font-size: 9px;
      }
    }
    
    /* Small phones (<= 400px) */
    @media (max-width: 400px) {
      .header h1 {
        font-size: 13px;
      }
      
      .header .status-badge {
        font-size: 9px;
        gap: 4px;
      }
      
      .sidebar .status-card {
        padding: 10px 12px;
        min-width: 100px;
      }
      
      .status-card .status-header .icon {
        font-size: 16px;
      }
      
      .status-card .status-header .state {
        font-size: 10px;
      }
      
      .status-card .row {
        font-size: 10px;
      }
      
      .sidebar .timeline-container {
        padding: 8px 10px;
        min-height: 80px;
      }
      
      .cards-track .card-item {
        min-width: 120px;
        max-width: 150px;
        padding: 6px 10px;
      }
      
      .cards-track .card-item .card-dest {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <h1>🛩️ Elon Musk Tracker</h1>
      <div class="status-badge">
        <span class="dot live" id="status-dot"></span>
        <span id="status-text">Live</span>
        <span style="color: #444;">|</span>
        <span id="last-updated">Updating...</span>
      </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
      <!-- Map -->
      <div class="map-container">
        <div id="map"></div>
      </div>
      
      <!-- Sidebar -->
      <div class="sidebar">
        <!-- Status Card -->
        <div class="status-card" id="status-card">
          <div class="status-header">
            <span class="icon" id="status-icon">❓</span>
            <span class="state unknown" id="status-state">UNKNOWN</span>
            <span class="badge" id="status-badge">● LIVE</span>
          </div>
          <div class="row">
            <span class="label">📍 Current</span>
            <span class="value" id="current-location">Unknown</span>
          </div>
          <div class="row observed-row">
            <span class="label">📡 Observed</span>
            <span class="value" id="observed-coords">—</span>
          </div>
          <div class="row">
            <span class="label">🎯 Destination</span>
            <span class="value" id="destination">Unknown</span>
          </div>
          <div class="row">
            <span class="label">📊 Confidence</span>
            <span class="value" id="confidence">0%</span>
          </div>
          
          <!-- Confidence Bar -->
          <div class="confidence-bar-container">
            <div class="confidence-bar">
              <div class="fill" id="confidence-fill"></div>
            </div>
            <div class="confidence-label">
              <span>Low</span>
              <span>Medium</span>
              <span>High</span>
            </div>
          </div>
          
          <div class="reasoning" id="reasoning">
            <li>Waiting for data...</li>
          </div>
          <div class="timestamp" id="timestamp">—</div>
          <div class="data-meta" id="data-meta">Source: — · Age: —</div>
        </div>
        
        <!-- Timeline Slider -->
        <div class="timeline-container">
          <div class="slider-header">
            <span>⏱️ Timeline</span>
            <span class="live-label" id="slider-mode" style="cursor:pointer;" title="Click to return to LIVE">🔴 LIVE</span>
          </div>
          <input type="range" id="time-slider" min="0" max="100" value="100" />
          
          <!-- ✅ Cards Track - Single horizontal row -->
          <div class="cards-track" id="cards-track">
            <div class="card-item">No cards yet</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Leaflet JS (Map Library) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Frontend Logic -->
  <script src="/frontend-polling.js"></script>
</body>
</html>
